const KEY='tea_estrategia_local_v1', $=id=>document.getElementById(id), fmt=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');

function record(msg){state.events.unshift(new Date().toLocaleString('pt-BR')+' — '+msg);state.events=state.events.slice(0,80)}
function bonus(p,item){let v=item.pd||0,g={'Plantações':'farm','Pecuária':'livestock','Minas':'mine','Indústria':'industry','Especiais':'special'}[item.category];let prof=countryProfiles.find(c=>c.name===p.name);if(prof){if(g===prof.plusCategory)v*=1+prof.plus;if(g===prof.minusCategory)v*=1+prof.minus}if(g==='farm'&&p.items.some(i=>catalog[i].name==='Erva'))v*=6;if(g==='industry'&&p.items.some(i=>catalog[i].name==='Usina nuclear'))v*=1.1;return Math.round(v)}
function pd(p){return p.items.reduce((a,i)=>a+bonus(p,catalog[i]),0)}
function settle(){let now=Date.now();for(const p of Object.values(state.countries)){let d=Math.floor((now-p.lastPaid)/86400000);if(d>0){p.cash+=pd(p)*d;p.lastPaid+=d*86400000;record(p.name+' recebeu '+fmt(pd(p)*d)+' por '+d+' dia(s)');}}save()}
function inventory(p){let m={};p.items.forEach(i=>m[i]=(m[i]||0)+1);return Object.entries(m).map(([i,n])=>'<div class="line"><span>'+esc(catalog[i].name)+' × '+n+'</span><span class="small">'+fmt(bonus(p,catalog[i]))+' PD/un.</span></div>').join('')||'<p>Sem itens.</p>'}

$('recruit').onclick=()=>{let k=$('armyType').value,n=+$('armyCount').value,price={soldados:20,tanques:180,bombas:350,escudos:250}[k];if(!Number.isSafeInteger(n)||n<1||n>999)return alert('Quantidade inválida');if(p.cash<n*price)return alert('Saldo insuficiente');p.cash-=n*price;p.army[k]+=n;record(p.name+' comprou '+n+' '+k);draw()};$('ally').onclick=()=>{let a=$('allianceName').value.trim();if(!a||a.length>45)return alert('Nome inválido');if(p.alliances.includes(a))return alert('Já está nesta aliança');if(p.alliances.length>=2)return alert('Limite de duas alianças');let members=Object.values(state.countries).filter(x=>x.alliances.includes(a));if(members.length>=3)return alert('Aliança cheia');p.alliances.push(a);record(p.name+' entrou na aliança '+a);draw()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{p.alliances.splice(+b.dataset.remove,1);draw()});
let sp=[];if(p.items.some(i=>catalog[i].name==='Arma de portal'))sp.push('<div class="line">Arma de portal (teleporte a cada 5 dias) <button id="portal">Usar</button></div>');if(p.items.some(i=>catalog[i].name==='Sistema de saúde'))sp.push('<div class="line">Sistema de saúde (aumenta população em 5%) <button id="health">Ativar</button></div>');if(p.items.some(i=>catalog[i].name==='Laboratório nuclear'))sp.push('<div class="line">Laboratório nuclear (gera bomba a cada 2 dias) <button id="nuclear">Produzir bomba</button></div>');$('specials').innerHTML=sp.join('')||'<p class="small">Itens passivos já afetam a produção. Itens ativáveis aparecem aqui quando comprados.</p>';if($('portal'))$('portal').onclick=()=>{if(Date.now()-p.portalUsed<5*86400000)return alert('Portal em recarga por 5 dias');p.portalUsed=Date.now();record(p.name+' ativou portal (efeito narrativo para negociação)');alert('Portal ativado! Combine o teleporte com o Banco Mundial na partida presencial.');draw()};if($('health'))$('health').onclick=()=>{if(Date.now()-p.healthUsed<7*86400000)return alert('Saúde só pode ser ativada a cada 7 dias');if(p.cash<50)return alert('Precisa de R$ 50');p.cash-=50;p.healthUsed=Date.now();p.population=(p.population||1000000)*1.05;record(p.name+' ativou saúde: população +5%');draw()};if($('nuclear'))$('nuclear').onclick=()=>{if(Date.now()-p.nuclearUsed<2*86400000)return alert('Espere 2 dias');p.nuclearUsed=Date.now();p.army.bombas++;record(p.name+' produziu uma bomba');draw()};}
function market(){let p=get();$('view').innerHTML='<section class="panel"><h2>Mercado Mundial</h2><p>Compre plantações, minas, indústrias e itens especiais. Saldo: <b class="good">'+(p?fmt(p.cash):'Crie um país')+'</b></p><div class="row"><select id="category">'+['Todos','Plantações','Pecuária','Minas','Indústria','Especiais'].map(c=>'<option '+(cat===c?'selected':'')+'>'+c+'</option>').join('')+'</select><input id="search" placeholder="Buscar item"></div><div class="grid" id="products"></div></section>';const render=()=>{let q=$('search').value.toLowerCase();$('products').innerHTML=catalog.map((x,i)=>({...x,i})).filter(x=>(cat==='Todos'||x.category===cat)&&x.name.toLowerCase().includes(q)).map(x=>'<div class="tile"><div class="small">'+esc(x.category)+' • Tier '+esc(x.tier)+'</div><h3>'+esc(x.name)+'</h3><p>'+fmt(x.price)+' • '+(x.pd==null?'Efeito especial':fmt(x.pd)+' PD')+'</p><p class="small">'+esc(x.notes||'')+'</p><button data-buy="'+x.i+'" '+(!p||p.cash<x.price?'disabled':'')+'>Comprar</button></div>').join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.buy,x=catalog[i];if(p.cash<x.price)return;p.cash-=x.price;p.items.push(i);record(p.name+' comprou '+x.name);draw()})};$('category').onchange=e=>{cat=e.target.value;render()};$('search').oninput=render;render()}
function war(){
let p=get(),all=Object.values(state.countries),others=all.filter(x=>x.name!==state.current&&!x.alliances.some(a=>p?.alliances.includes(a)));
let myAlliances=p?p.alliances:[], rivalAlliances=[...new Set(all.flatMap(x=>x.alliances))].filter(a=>!myAlliances.includes(a));
$('view').innerHTML='<section class="panel"><h2>Guerras entre países</h2><p>Unidades enviadas são consumidas. Aliados não podem ser atacados.</p>'+(!p?'<p>Funde um país primeiro.</p>':!others.length?'<p>Não há inimigos disponíveis. Crie um país de teste fora da sua aliança no Banco Mundial.</p>':'<label>País inimigo</label><select id="target">'+others.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><div class="grid">'+['soldados','tanques','bombas'].map(k=>'<div><label>'+k+' (disponíveis: '+p.army[k]+')</label><input id="send_'+k+'" type="number" min="0" max="'+p.army[k]+'" value="0"></div>').join('')+'</div><p><button id="attack">Atacar agora</button></p>')+'</section>'+
'<section class="panel"><h2>Guerra entre alianças</h2><p>Todos os membros da sua aliança enviam suas tropas disponíveis juntos. As unidades usadas são perdidas após a batalha. Cada país rival contribui com sua defesa. Ataques em grupo têm intervalo de 6 horas por aliança.</p>'+
(!p||!myAlliances.length?'<p>Entre em uma aliança para participar.</p>':!rivalAlliances.length?'<p>Não há aliança rival. Crie uma aliança diferente com outro país de teste.</p>':
'<label>Sua aliança</label><select id="myAlly">'+myAlliances.map(a=>'<option>'+esc(a)+'</option>').join('')+'</select><label>Aliança adversária</label><select id="enemyAlly">'+rivalAlliances.map(a=>'<option>'+esc(a)+'</option>').join('')+'</select><p><button id="allianceAttack">Iniciar guerra de alianças</button></p>')+'</section>'+
'<section class="panel"><h2>Últimos acontecimentos</h2>'+state.events.slice(0,12).map(x=>'<div class="line small">'+esc(x)+'</div>').join('')+'</section>';
if($('attack'))$('attack').onclick=()=>{let t=state.countries[$('target').value],n={};for(let k of ['soldados','tanques','bombas']){n[k]=Number($('send_'+k).value);if(!Number.isSafeInteger(n[k])||n[k]<0||n[k]>p.army[k])return alert('Quantidade inválida: '+k)}if(Object.values(n).every(x=>x===0))return alert('Envie pelo menos uma unidade');if(Date.now()-p.lastWar<6*3600000)return alert('Aguarde 6 horas entre ataques');let atk=n.soldados+5*n.tanques+12*n.bombas,def=t.army.soldados+5*t.army.tanques+12*t.army.bombas+8*t.army.escudos;for(let k in n)p.army[k]-=n[k];p.lastWar=Date.now();let win=atk>def;if(win){let steal=Math.min(t.cash,Math.floor(t.cash*.2));t.cash-=steal;p.cash+=steal;let lost=Math.min(t.army.escudos,Math.max(1,Math.ceil(atk/10)));t.army.escudos-=lost;record(p.name+' venceu '+t.name+' e capturou '+fmt(steal));alert('Vitória! Capturou '+fmt(steal)+'. O inimigo perdeu '+lost+' escudos.')}else{record(p.name+' atacou '+t.name+' e foi derrotado');alert('Derrota. A defesa inimiga resistiu. Suas unidades enviadas foram perdidas.')}draw()};
if($('allianceAttack'))$('allianceAttack').onclick=()=>{
let a=$('myAlly').value,b=$('enemyAlly').value;
let attackers=all.filter(x=>x.alliances.includes(a)),defenders=all.filter(x=>x.alliances.includes(b));
if(!attackers.length||!defenders.length||attackers.some(x=>defenders.includes(x)))return alert('Alianças incompatíveis: existe um país dos dois lados.');
let now=Date.now(),last=Math.max(...attackers.map(x=>x.lastAllianceWar||0));
if(now-last<6*3600000)return alert('A aliança precisa esperar 6 horas para atacar novamente.');
let power=attackers.reduce((v,x)=>v+x.army.soldados+5*x.army.tanques+12*x.army.bombas,0);
if(!power)return alert('A aliança precisa de soldados, tanques ou bombas.');
let defense=defenders.reduce((v,x)=>v+x.army.soldados+5*x.army.tanques+12*x.army.bombas+8*x.army.escudos,0);
if(!confirm('Enviar TODAS as tropas ofensivas de '+a+' contra '+b+'? Elas serão perdidas após a batalha.'))return;
attackers.forEach(x=>{x.army.soldados=0;x.army.tanques=0;x.army.bombas=0;x.lastAllianceWar=now});
if(power>defense){
let loot=0;defenders.forEach(x=>{let v=Math.floor(x.cash*.2);x.cash-=v;loot+=v;let shields=Math.min(x.army.escudos,Math.max(1,Math.ceil(power/(10*defenders.length))));x.army.escudos-=shields});
let each=Math.floor(loot/attackers.length);attackers.forEach((x,i)=>x.cash+=each+(i===0?loot-each*attackers.length:0));
record('Aliança '+a+' venceu '+b+' e capturou '+fmt(loot));alert('Vitória da aliança '+a+'! Capturaram '+fmt(loot)+' no total, dividido entre os membros.');
}else{record('Aliança '+a+' foi derrotada por '+b);alert('A aliança '+b+' resistiu! As tropas enviadas foram perdidas.')}
draw();
};
}
function rules(){
$('view').innerHTML=`<section class="panel"><h2>Como jogar TEA</h2>
<p>TEA é um jogo de estratégia, economia e diplomacia. Cada jogador governa um país, desenvolve sua produção e decide com quem negociar, formar alianças ou entrar em guerra.</p>
<h3>1. Começando</h3><p>Funde um país em <b>Meu país</b>. Você começa com R$ 100. Nesta versão de teste, todos os países ficam salvos apenas neste navegador.</p>
<h3>2. Dinheiro e produção</h3><p>Compre plantações, pecuária, minas e indústrias no <b>Mercado</b>. PD significa produção diária: o valor gerado a cada 24 horas completas. Bônus e penalidades do país modificam a PD de determinadas categorias.</p>
<h3>3. Itens especiais</h3><p>A Erva aumenta em 500% a produção de plantações; a Usina Nuclear aumenta em 10% a PD industrial. Outros itens podem produzir bombas, aumentar a população ou oferecer efeitos de negociação. Veja os efeitos em Meu país.</p>
<h3>4. Exército e guerras</h3><p>Compre soldados, tanques, bombas e escudos em Meu país. Em Guerras, selecione um país inimigo e envie unidades. Todas as unidades enviadas são consumidas, mesmo na derrota. Escudos protegem o defensor. Vitória pode capturar até 20% do dinheiro do país atacado. Aguarde 6 horas entre ataques.</p>
<h3>5. Alianças</h3><p>Um país pode entrar em até duas alianças; cada aliança aceita no máximo três países. Países da mesma aliança não podem atacar uns aos outros. Para testar, entre com outros países na aliança usando o mesmo nome.</p>
<h3>6. Guerras entre alianças</h3><p>Em Guerras, escolha uma aliança sua e uma aliança rival. O ataque utiliza as tropas dos membros da sua aliança, descontando as unidades enviadas. O resultado considera as defesas de todos os países rivais. Uma vitória captura recursos dos adversários. Nesta demonstração local, o ataque é feito sem aprovação individual dos aliados.</p>
<h3>7. Banco Mundial</h3><p>O administrador pode consultar contas, adicionar ou retirar dinheiro e criar países para testes. O código protege o banco apenas nesta versão local; não equivale a autenticação segura online.</p>
<h3>8. Limitações da versão</h3><p>Os dados são salvos no próprio navegador. Não há sincronização entre celulares, nem bloqueio seguro de países entre dispositivos. Para jogar multiplayer de verdade, é necessário um servidor online.</p>
</section>`;}

function bank(){let p=get();if(!state.adminPin){$('view').innerHTML='<section class="panel"><h2>Configurar Banco Mundial</h2><p>Defina um código secreto de administrador neste navegador. Não compartilhe o código.</p><input id="pin" type="password" placeholder="Código do Banco (mínimo 6 caracteres)"><button id="setPin">Configurar</button><p class="small">Atenção: esta é uma demonstração local, não uma proteção segura para multiplayer.</p></section>';$('setPin').onclick=()=>{let x=$('pin').value;if(x.length<6)return alert('Mínimo 6 caracteres');state.adminPin=x;state.bankUnlocked=true;draw()};return}if(!state.bankUnlocked){$('view').innerHTML='<section class="panel"><h2>Banco Mundial</h2><input id="pin" type="password" placeholder="Código do administrador"> <button id="unlock">Entrar</button></section>';$('unlock').onclick=()=>{if($('pin').value!==state.adminPin)return alert('Código incorreto');state.bankUnlocked=true;draw()};return}
$('view').innerHTML='<section class="panel"><div class="line"><h2>Banco Mundial — Administração</h2><button id="lock">Bloquear banco</button></div><p>Visualize as contas dos países criados neste navegador e faça créditos ou débitos.</p><div class="stats">'+Object.values(state.countries).map(x=>'<div class="tile">'+esc(x.name)+'<strong>'+fmt(x.cash)+'</strong><div class="small">'+fmt(pd(x))+' PD • '+x.items.length+' itens</div></div>').join('')+'</div><hr><h3>Movimentar conta</h3><div class="row"><select id="account">'+Object.values(state.countries).map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><input id="amount" type="number" min="1" max="1000000000" value="100"><button id="credit">Adicionar dinheiro</button><button id="debit">Retirar dinheiro</button></div><hr><h3>Criar país de teste</h3><p class="small">Para testar guerra e alianças neste dispositivo, o banco pode criar um país adversário.</p><div class="row"><select id="testCountry">'+names.filter(n=>!state.countries[n]).map(n=>'<option>'+esc(n)+'</option>').join('')+'</select><button id="makeTest">Criar país de teste</button></div><hr><h3>Trocar país ativo para testar</h3><div class="row"><select id="switch">'+Object.values(state.countries).map(x=>'<option '+(x.name===state.current?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><button id="switchBtn">Trocar</button></div><p class="bad small">Troca de país disponível somente nesta demonstração local para testes. Não é um sistema seguro de contas.</p></section>';
$('lock').onclick=()=>{state.bankUnlocked=false;draw()};function move(sign){let x=state.countries[$('account').value],n=Number($('amount').value);if(!Number.isSafeInteger(n)||n<1||n>1e9)return alert('Valor inválido');if(sign<0&&x.cash<n)return alert('Saldo insuficiente');x.cash+=n*sign;record('Banco '+(sign>0?'creditou ':'debitou ')+fmt(n)+' de '+x.name);draw()}$('credit').onclick=()=>move(1);$('debit').onclick=()=>move(-1);$('makeTest').onclick=()=>{let n=$('testCountry').value;if(!n)return alert('Sem países livres');state.countries[n]={name:n,cash:100,items:[],army:{soldados:0,tanques:0,bombas:0,escudos:0},alliances:[],lastPaid:Date.now(),lastWar:0,portalUsed:0,healthUsed:0,nuclearUsed:0};record('Banco criou '+n+' para teste');draw()};$('switchBtn').onclick=()=>{state.current=$('switch').value;tab='Meu país';draw()}}
draw();
</script></html>
